<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التمثيل الضوئي ١-١ · القرية التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5EC; --surface:#FFFFFF; --surface-2:#F7F9F3;
  --ink:#152B1C; --muted:#58705E; --line:#D3DECB;
  --leaf:#2E8B47; --leaf-deep:#1C5A2E; --leaf-soft:#DDEFD9;
  --sun:#D9920F; --sun-soft:#FBEFD2; --water:#2A74B5; --water-soft:#DCEAF6;
  --air:#6B5BB0; --air-soft:#E8E4F6;
  --good:#23894A; --good-soft:#DAF1E1; --bad:#C2412F; --bad-soft:#F9E1DC;
  /* ألوان الإتقان */
  --b1:#E2735F; --b2:#E8913A; --b3:#E2BC2E; --b4:#6DBE7B; --b5:#1F7A3D; --gray:#B3BEB6; --blue:#3B82C4;
  --shadow:0 1px 2px rgba(21,43,28,.06),0 8px 24px rgba(21,43,28,.08);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Kufi Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1611; --surface:#15221A; --surface-2:#1C2D22; --ink:#E4EEE5; --muted:#9BB2A1; --line:#28392D;
  --leaf:#5CC274; --leaf-deep:#8FDDA0; --leaf-soft:#1D3A25; --sun:#F0B544; --sun-soft:#3A2E14;
  --water:#6BB0E8; --water-soft:#16314A; --air:#A99AF0; --air-soft:#2A2547;
  --good:#5CC274; --good-soft:#173A22; --bad:#F08A78; --bad-soft:#41201B;
  --b1:#EF8A77; --b2:#F0A353; --b3:#E9C94A; --b4:#7FD08C; --b5:#3FAE62; --gray:#55665A; --blue:#6BB0E8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
b,strong{font-weight:700}
h1,h2,h3{font-family:var(--f-display);line-height:1.5;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
/* ---------- رأس الموقع ---------- */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:720px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--leaf);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.top .brand{font-family:var(--f-display);font-weight:800;font-size:15px}
.top .crumb{margin-inline-start:auto;font-size:13px;color:var(--muted);text-decoration:none}
/* ---------- البداية ---------- */
.hero{background:linear-gradient(160deg,var(--leaf-deep),var(--leaf));color:#fff;border-radius:24px;padding:20px 18px;margin-top:4px;box-shadow:var(--shadow)}
.hero .code{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:0 12px;font-size:13px}
.hero h1{font-size:28px;margin:6px 0 0}
.hero p.sub{margin:0;opacity:.85;font-size:14px}
.hero .overall{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .overall span{background:rgba(255,255,255,.16);border-radius:12px;padding:2px 10px;font-size:13px}
.salem{display:flex;align-items:flex-end;gap:10px;margin:14px 0 4px}
.salem img{width:62px;height:68px;flex:none}
.bubble{position:relative;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;margin:0;font-size:15.5px;box-shadow:var(--shadow)}
.hero .bubble{border-color:transparent}
.resume{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;background:var(--sun-soft);border:2px solid var(--sun);border-radius:16px;padding:10px 14px;text-align:start}
.resume b{display:block;font-size:16px}.resume small{color:var(--muted)}
.resume .ico{font-size:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 8px}
.sec-h h2{font-size:19px}.sec-h small{color:var(--muted);font-size:13px}
/* ---------- الشريط المنزلق ---------- */
.slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;margin:0 -16px;padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slider::-webkit-scrollbar{display:none}
.scard{flex:0 0 78%;max-width:280px;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative;min-height:236px}
.scard.next{border:2px solid var(--leaf)}
.scard .top-row{display:flex;align-items:center;gap:8px}
.scard .num{width:30px;height:30px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf-deep);display:grid;place-items:center;font-weight:700;font-size:14px}
.scard .ico{font-size:34px;line-height:1}
.scard .badge{margin-inline-start:auto;font-size:11.5px;background:var(--leaf-soft);color:var(--leaf-deep);border-radius:999px;padding:1px 9px}
.scard .badge.warm{background:var(--sun-soft);color:var(--sun)}
.scard h3{font-size:17px;margin-top:4px}
.scard .sub{color:var(--muted);font-size:13.5px;line-height:1.5}
.scard .foot{margin-top:auto}
.bar{height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .6s ease,background .3s}
.bar.thin{height:7px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:4px;gap:6px}
.meta b{font-size:15px}
.meta .lbl{color:var(--muted)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--leaf);width:18px;border-radius:9px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin:10px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.goals ol,.sbody ol{list-style:arabic-indic}.goals ol{margin:0;padding-inline-start:24px}
/* ---------- المحطة ---------- */
.stbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--bg);padding:10px 0 8px;margin:0 -2px}
.stname{flex:1;min-width:0;line-height:1.35}
.stname small{display:block;color:var(--muted);font-size:12px}
.stname b{display:block;font-family:var(--f-display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 11px;font-size:14px}
.chip{background:var(--sun-soft);border:1px solid var(--sun);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13.5px;white-space:nowrap}
.slbl{font-size:12.5px;color:var(--muted);margin-top:2px}.sdots{display:flex;gap:6px;align-items:center;margin:2px 0 10px}.sdots button{height:6px!important}.sdots button.end{height:22px!important;flex-basis:22px!important;font-size:11px!important}
.sdots button{flex:1;height:8px;border:0;border-radius:6px;background:var(--line);padding:0}
.sdots button.seen{background:var(--gray)}
.sdots button.cur{background:var(--leaf)}
.sdots button.end{flex:0 0 26px;height:26px;border-radius:50%;font-size:13px;background:var(--surface);border:1px solid var(--line)}
.sdots button.end.cur{background:var(--leaf);color:#fff}
.slide,.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);animation:pop .35s ease}
@keyframes pop{from{opacity:.4}to{opacity:1}}
.slide .salem{margin-top:0}
.sh{font-size:21px;margin:12px 0 6px;color:var(--leaf-deep)}
.sbody p{margin:6px 0}
.sbody ol,.sbody ul{padding-inline-start:22px;margin:6px 0}
.def{background:var(--leaf-soft);border-inline-start:5px solid var(--leaf);border-radius:12px;padding:10px 14px;margin:10px 0}
.sum li{margin:6px 0}
.art{margin:12px 0 4px;background:var(--surface-2);border-radius:16px;padding:12px;text-align:center}
.art svg{max-width:100%;height:auto}
.emo{font-size:40px;letter-spacing:6px}
.cap{font-size:13.5px;color:var(--muted);margin-top:4px}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px}
.chain .org{display:flex;flex-direction:column;align-items:center;font-size:34px;line-height:1.2;padding:4px 6px;border-radius:14px;transition:.3s;border:2px solid transparent}
.chain .org small{font-size:12px;color:var(--muted)}
.chain .ar{color:var(--muted);font-size:20px}
.chain .org.lit{background:var(--sun-soft);border-color:var(--sun);transform:scale(1.08)}
.chain .ar.lit{color:var(--sun)}
.eq{display:flex;flex-direction:column;align-items:center;gap:6px}
.eq .box{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.eq .box span{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 12px;font-weight:700}
.eq .in span{border-color:var(--water)}.eq .out span{border-color:var(--leaf)}
.eq .arrow{display:flex;flex-direction:column;align-items:center;color:var(--sun);font-weight:700;font-size:14px}
.eq .arrow i{font-style:normal;font-size:28px;line-height:1}
.nav{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;background:var(--leaf);color:#fff;border:0;border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--leaf-deep)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;flex:0 0 auto}
.btn.warm{background:var(--sun);box-shadow:0 3px 0 #9c6a0a}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #22598a}
.btn.full{width:100%;display:block;margin-top:10px}
.gate{font-size:13.5px;color:var(--sun);text-align:center;margin:8px 0 0}
.skip{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline}
/* أسئلة سريعة داخل الشرائح */
.check{margin-top:14px;border:2px dashed var(--sun);border-radius:16px;padding:12px;background:var(--sun-soft)}
.check .ck-h{font-size:13px;font-weight:700;color:var(--sun)}
.check p.q{margin:4px 0 8px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;text-align:start;font-size:16px;line-height:1.55;transition:.15s}
.opt:not(:disabled):active{transform:scale(.98)}
.opt.sel{border-color:var(--blue);background:var(--water-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{opacity:1;cursor:default}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.tf .opt{text-align:center;font-weight:700}
.why{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:15px}
.why.good{background:var(--good-soft);border:1px solid var(--good)}
.why.bad{background:var(--bad-soft);border:1px solid var(--bad)}
/* تفاعلات */
.term{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.term button{min-width:120px;border:2px solid var(--leaf);background:var(--surface);border-radius:16px;padding:10px;line-height:1.4}
.term button b{display:block;font-size:20px;direction:ltr}
.term button span{font-size:13px;color:var(--muted)}
.term button.open{background:var(--leaf-soft)}
.term button.open span{color:var(--leaf-deep);font-weight:700;font-size:17px}
.term .plus{font-size:24px;color:var(--muted)}
.hotwrap{position:relative;max-width:340px;margin:0 auto}
.hot{position:absolute;transform:translate(50%,-50%);width:40px;height:40px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:700;box-shadow:0 0 0 0 rgba(0,0,0,.25);animation:pulse 1.6s infinite}
.hot.seen{animation:none;opacity:.75}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,146,15,.6)}70%{box-shadow:0 0 0 12px rgba(217,146,15,0)}100%{box-shadow:0 0 0 0 rgba(217,146,15,0)}}
.hotinfo{margin-top:10px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:start;background:var(--surface)}
.sortrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 10px;margin:6px 0}
.sortrow.ok{border-color:var(--good);background:var(--good-soft)}
.sortrow .b2{display:flex;gap:6px;margin-inline-start:auto}.sortrow .b2 button{white-space:nowrap}
.sortrow .b2 button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:3px 10px;font-size:14px}
.sortrow.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* بطاقة العنوان + أزرار التنقل */
.tcard{background:var(--surface);border:2px solid var(--leaf);border-radius:22px;padding:14px 16px;margin:4px 0 14px;box-shadow:var(--shadow)}
.tc-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.tc-ico{font-size:36px;line-height:1;width:56px;height:56px;display:grid;place-items:center;background:var(--leaf-soft);border-radius:16px;flex:none}
.tc-txt small{display:block;color:var(--muted);font-size:13px}
.tc-txt h1{font-size:23px;color:var(--leaf-deep);line-height:1.4}
.tcard .bar{margin-top:4px}
.slide.simple{margin-bottom:4px}
.slide.simple .sbody{font-size:18px}
.navrow{display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:8px;margin-top:16px;align-items:stretch}
.navrow.two{grid-template-columns:1fr 2.2fr}
.nb{min-height:68px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:15px;line-height:1.4;padding:6px}
.nb.main{background:var(--leaf);border-color:var(--leaf);color:#fff;font-size:18px;box-shadow:0 4px 0 var(--leaf-deep)}
.nb.main.warm{background:var(--sun);border-color:var(--sun);box-shadow:0 4px 0 #9c6a0a}
.nb.main:disabled{background:var(--gray);border-color:var(--gray);box-shadow:none;opacity:1}
.morebtn{display:block;width:100%;margin-top:10px;padding:9px;border:2px dashed var(--sun);background:var(--sun-soft);border-radius:14px;font-weight:700;font-size:16px}
.nextlink{display:block;width:100%;margin-top:10px;padding:9px;border:2px solid var(--leaf);background:var(--leaf-soft);border-radius:14px;font-weight:700;font-size:16px;color:var(--leaf-deep)}
.layer{margin-top:18px;animation:pop .4s ease}
.lh{font-size:18px;color:var(--sun);border-top:3px dashed var(--sun);padding-top:12px;margin-bottom:4px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.lcard h3{font-size:17px;color:var(--leaf-deep);margin:6px 0 4px}
.salem.small{margin:0 0 4px}.salem.small img{width:44px;height:48px}.salem.small .bubble{font-size:14.5px;padding:8px 12px}
.obs{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.qfig{margin:0 0 12px}
.figkey{text-align:start;font-size:14.5px;margin:6px 0 0;padding-inline-start:4px;list-style:none}
.ftab{width:100%;border-collapse:collapse;font-size:15px;background:var(--surface)}
.ftab th,.ftab td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.ftab th{background:var(--leaf-soft)}
.resetbtn{display:block;margin:22px auto 0;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 16px;font-size:14.5px;color:var(--muted)}
.wrwhy{font-size:14px;color:var(--muted);margin:2px 0 4px;padding-inline-start:10px;border-inline-start:3px solid var(--bad)}
.sumcard{background:var(--leaf-soft);border:2px solid var(--leaf);border-radius:18px;padding:12px 14px;margin:12px 0}
.sumcard h3{font-size:16px;color:var(--leaf-deep);margin-bottom:4px}
.sumcard ul{margin:0;padding-inline-start:20px}.sumcard li{margin:4px 0}
.sumcard.locked{background:var(--surface-2);border:1.5px dashed var(--line);color:var(--muted);font-size:15px}
.rh{font-size:16px;color:var(--leaf-deep);margin-bottom:6px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.rbox b{display:block;font-family:var(--f-display);font-size:22px;color:var(--leaf-deep)}.rbox small{color:var(--muted);font-size:13px}
.rst{padding:8px 0;border-bottom:1px dashed var(--line)}.rst:last-child{border-bottom:0}
.rst-h{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:4px}
.rst-m{font-size:13px;color:var(--muted);margin-top:4px}
.panel+.panel{margin-top:12px}
.fillline{font-size:18px;line-height:2.2;background:var(--surface-2);border-radius:14px;padding:10px 12px;margin:0 0 12px}
.blank{display:inline-block;min-width:80px;text-align:center;border-bottom:3px dashed var(--sun);color:var(--sun);font-weight:700;padding:0 8px}
.blank.on{border-bottom-style:solid;color:var(--leaf-deep)}
.oslots{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;margin:6px 0 10px}
.oslot{min-width:74px;min-height:58px;border:2px dashed var(--line);border-radius:12px;background:var(--surface-2);font-size:14px;line-height:1.35;padding:4px 6px;position:relative}
.oslot small{position:absolute;top:2px;right:6px;font-size:10px;color:var(--muted)}
.oslot.on{border-style:solid;border-color:var(--blue);background:var(--water-soft);font-weight:700}
.oar{color:var(--muted);font-size:18px}
.qrow{border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:8px 0;background:var(--surface-2)}
.qrow-t{font-weight:700;margin-bottom:6px}
.qrow .pool{justify-content:flex-start}
.eslot{min-width:70px;border:2px dashed var(--sun);background:var(--sun-soft);border-radius:12px;padding:4px 10px;font-weight:700;font-size:15px}
.eslot.on{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft)}
.bmission{text-align:center;font-weight:700;background:var(--sun-soft);border-radius:12px;padding:6px;margin-bottom:8px}
.btank{position:relative;height:320px;border-radius:16px;background:linear-gradient(180deg,var(--water-soft),var(--surface-2));overflow:hidden;margin-bottom:10px;border:1px solid var(--line)}
.bub2{position:absolute;bottom:-50px;border:2px solid var(--water);background:rgba(255,255,255,.9);color:#152B1C;border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:700;animation:floatup linear forwards;white-space:nowrap}
.bub2.pop{transform:scale(1.3);opacity:0;transition:.3s}.bub2.good{background:var(--good-soft);border-color:var(--good)}.bub2.bad{background:var(--bad-soft);border-color:var(--bad)}
@keyframes floatup{from{bottom:-50px}to{bottom:340px}}
.clues{display:grid;gap:6px;margin-bottom:6px}
.clue{background:var(--air-soft);border-inline-start:4px solid var(--air);border-radius:10px;padding:6px 10px;animation:pop .4s}
.hot.sm{width:22px;height:22px;border-width:2px}
.word.wrongw{border-color:var(--bad);background:var(--bad-soft)}
.qrow.okrow{border-color:var(--good)}
/* مسار الرحلة */
.path{display:flex;align-items:center;margin:0 0 12px}
.path i{flex:1;height:3px;background:var(--line);border-radius:2px}
.path button{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;padding:0;line-height:1}
.path button.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.path button.cur{background:var(--leaf);border-color:var(--leaf);color:#fff;transform:scale(1.15);box-shadow:0 0 0 4px var(--leaf-soft)}
/* أسئلة الاختبارات */
.exq{margin:10px 0}
.exh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.exh .tag{margin:0}.exh .ok{margin-inline-start:auto}
.exq img{width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:zoom-in;display:block}
.modal.zoom{display:flex;flex-direction:column;gap:10px;padding:12px}
.zbox{flex:1;width:100%;overflow:auto;background:#fff;border-radius:12px;display:flex;align-items:center}
.zbox img{width:170%;max-width:none;height:auto}
.modal.zoom .btn{flex:none;width:100%;max-width:420px}
/* نافذة */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:20px}
.modal .panel{max-width:420px;width:100%}
/* نتيجة */
.ring{width:140px;height:140px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-family:var(--f-display);font-size:30px}
.center{text-align:center}
.res-h{font-size:22px;text-align:center}
.res-sub{text-align:center;color:var(--muted);margin:2px 0 10px}
.revlist{list-style:none;padding:0;margin:10px 0}
.revlist li{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;background:var(--surface-2);font-size:15px}
.revlist li .x{color:var(--bad);font-weight:700}
.revlist li .v{color:var(--good);font-weight:700}
.linkbtn{background:none;border:0;color:var(--water);font-weight:700;padding:0;text-decoration:underline;font-size:14.5px}
.note{background:var(--sun-soft);border:1px solid var(--sun);border-radius:14px;padding:10px 12px;font-size:15px;margin:10px 0}
.tag{display:inline-block;font-size:12.5px;border-radius:999px;padding:1px 10px;margin-bottom:6px}
.tag.fix{background:var(--air-soft);color:var(--air);font-weight:700}
.tag.st{background:var(--leaf-soft);color:var(--leaf-deep)}
.qq{font-size:19px;margin:6px 0 12px;font-family:var(--f-body);font-weight:700;line-height:1.6}
.morecard{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--sun);border-radius:16px;padding:12px 14px;margin:10px 0}
.morecard h3{font-size:16px;margin-bottom:4px}
.grid{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:start;box-shadow:var(--shadow)}
.tile .ico{font-size:30px}
.tile b{display:block}.tile small{color:var(--muted)}
.tile .ok{margin-inline-start:auto;font-size:20px}
.perrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.perrow .bar{flex:1}
.perrow .nm{flex:0 0 96px;font-size:14px}
/* مختبرات */
.toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tog{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px;line-height:1.4;font-size:13.5px}
.tog .e{font-size:26px;display:block}
.tog.on{border-color:var(--leaf);background:var(--leaf-soft)}
.tog:not(.on){filter:grayscale(1);opacity:.6}
.factory{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0;min-height:90px}
.factory .plant{font-size:60px;transition:.4s}
.factory .plant.dim{filter:grayscale(1) brightness(.8)}
.factory .outs{display:flex;flex-direction:column;gap:6px}
.factory .outs span{border:2px dashed var(--line);border-radius:12px;padding:2px 10px;opacity:.35;transition:.4s}
.factory .outs span.on{opacity:1;border-style:solid;border-color:var(--leaf);background:var(--leaf-soft)}
.tasks{list-style:none;padding:0;margin:8px 0;font-size:14.5px}
.tasks li::before{content:"☐ "}.tasks li.done::before{content:"✅ "}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--surface-2);font-size:14px}
.grp h4{margin:0 0 6px;font-family:var(--f-display);font-size:14px}
.seg{display:flex;flex-direction:column;gap:5px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:4px;font-size:13.5px}
.seg button.on{border-color:var(--blue);background:var(--water-soft)}
.grp input[type=range]{width:100%}
.grp label{display:flex;align-items:center;gap:6px;margin-top:6px}
/* ألعاب */
.gstats{display:flex;justify-content:space-around;background:var(--surface-2);border-radius:14px;padding:6px;margin-bottom:10px;font-size:14px;text-align:center}
.gstats b{display:block;font-size:20px}
.tfq{font-size:19px;font-weight:700;text-align:center;min-height:96px;display:grid;place-items:center;padding:10px;border-radius:16px;border:2px solid var(--line);margin-bottom:10px;transition:.2s}
.tfq.good{border-color:var(--good);background:var(--good-soft)}.tfq.bad{border-color:var(--bad);background:var(--bad-soft)}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bucket{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:120px;background:var(--surface-2);text-align:center}
.bucket h4{margin:0 0 6px;font-family:var(--f-display);font-size:14px}
.bucket.hl{border-color:var(--blue);background:var(--water-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.word{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 12px;font-size:15px}
.word.picked{border-color:var(--blue);background:var(--water-soft)}
.word.ok{border-color:var(--good);background:var(--good-soft)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{aspect-ratio:1/1;border:2px solid var(--line);border-radius:14px;background:var(--leaf);color:#fff;font-size:13.5px;line-height:1.4;padding:4px;font-weight:700}
.mc.flip{background:var(--surface);color:var(--ink)}
.mc.match{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.stars{font-size:22px;letter-spacing:2px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14.5px;z-index:30;animation:pop .3s}
.foot-note{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.bub{animation:rise 2.4s infinite}
</style>
</head>

  { id: 'a10', lv: 3, q: 'يعيش في كهف مظلم تمامًا نوع من الأسماك يتغذّى على أوراق وبقايا كائنات يجلبها الماء من خارج الكهف. لماذا لا توجد نباتات خضراء داخل الكهف؟', opts: ['لأنه لا يوجد ضوء، فلا تستطيع النباتات صنع غذائها', 'لأن الأسماك تأكل النباتات، فلا تبقى منها واحدة', 'لأن ماء الكهف بارد، فلا تنمو فيه البذور', 'لأن النباتات لا تحتاج إلى العيش في الكهوف'], a: 'لأنه لا يوجد ضوء، فلا تستطيع النباتات صنع غذائها', why: 'بلا ضوء لا يحدث التمثيل الضوئي، فيأتي الغذاء من نباتات تعيش خارج الكهف في الضوء.' },
  { id: 'a11', lv: 3, q: 'لو اختفت كل النباتات من منطقة ما، ماذا يحدث للسلسلة الغذائية فيها؟', opts: ['تنهار، لأن الطاقة تدخل السلسلة عن طريق النبات', 'لا تتأثر أبدًا', 'يتأثر آكلو النبات فقط، ولا يتأثر الصقر', 'تبدأ السلسلة بالحيوانات بدلًا من النبات'], a: 'تنهار، لأن الطاقة تدخل السلسلة عن طريق النبات', why: 'كل كائن في السلسلة يعتمد على الطاقة التي دخلت عن طريق النبات.' },
  { id: 'a12', lv: 3, q: 'قال هيثم: «الإنسان الذي يأكل اللحم فقط لا يعتمد على التمثيل الضوئي». اختر أدقّ ردّ عليه:', opts: ['كلامه غير صحيح، فالحيوان الذي يأكله أخذ طاقته من النبات', 'كلامه صحيح، لأن اللحم ليس نباتًا ولا يصنع غذاءه', 'كلامه صحيح، لأن الإنسان لا يصنع غذاءه بنفسه', 'كلامه غير صحيح، لأن الإنسان يقوم بالتمثيل الضوئي'], a: 'كلامه غير صحيح، فالحيوان الذي يأكله أخذ طاقته من النبات', why: 'تتبّع الطاقة إلى الوراء: اللحم ← حيوان أكل العشب ← العشب صنع غذاءه بطاقة الضوء.' },
  { id: 'a13', lv: 3, fig: 'chainSun', q: 'لو غطّت سحب كثيفة جدًا المنطقة أسابيع طويلة، أيّ كائن في السلسلة الموضّحة يتأثر أولًا؟', opts: ['النخلة، لأنها تحتاج إلى الضوء لتصنع غذاءها', 'الثعبان، لأنه في آخر السلسلة ويأكل العصفور', 'العصفور، لأنه يطير عاليًا قرب السحب', 'لا يتأثر أيّ كائن، لأن السحب لا تحجب الضوء'], a: 'النخلة، لأنها تحتاج إلى الضوء لتصنع غذاءها', why: 'يقلّ الضوء فيقلّ الغذاء الذي تصنعه النخلة، ثم يتأثر بعدها الجراد فالعصفور فالثعبان.' },
  { id: 'a14', lv: 3, q: 'شبّه سالم ورقة النبات بـ«اللوح الشمسي» الذي يوضع على أسطح البيوت. ما وجه الشبه الأدق؟', opts: ['كلاهما يلتقط طاقة الضوء ويحوّلها إلى شكل آخر', 'كلاهما يصنع الماء ويخزّنه لوقت الحاجة', 'كلاهما يعمل في الليل فقط ويتوقّف نهارًا', 'كلاهما يأخذ طاقته من التربة تحته'], a: 'كلاهما يلتقط طاقة الضوء ويحوّلها إلى شكل آخر', why: 'اللوح الشمسي يحوّل الضوء إلى كهرباء، والورقة تحوّل طاقة الضوء إلى طاقة مخزونة في الغذاء.' },
  { id: 'a15', lv: 3, q: 'في صحراء الربع الخالي تكون النباتات قليلة جدًا. ما التفسير الأدق لقلّة أعداد الحيوانات هناك أيضًا؟', opts: ['لأن قلّة النباتات تعني غذاءً وطاقة أقل لبقية السلسلة', 'لأن الحيوانات لا تحب الرمل فتهرب إلى الجبال', 'لأن الشمس هناك ضعيفة فلا تدفئ الحيوانات', 'لأنه لا علاقة بين عدد النباتات وعدد الحيوانات'], a: 'لأن قلّة النباتات تعني غذاءً وطاقة أقل لبقية السلسلة', why: 'النبات هو مدخل الطاقة إلى السلسلة، فكلما قلّ النبات قلّ الغذاء المتاح لبقية الكائنات.' }
],
s2: [
  { id: 'b16', lv: 1, tf: true, q: 'يأخذ النبات ثاني أكسيد الكربون من التربة عن طريق الجذور.', a: 'خطأ', why: 'يأخذه من الهواء عن طريق الأوراق. الجذور تمتصّ الماء.' },
  { id: 'b17', lv: 2, tf: true, q: 'في الاختبار العادل نغيّر شيئًا واحدًا فقط، ونثبّت كل شيء آخر.', a: 'صواب', why: 'هكذا نعرف أن الفرق في النتيجة سببه الشيء الذي غيّرناه.' },
  { id: 'b18', lv: 2, tf: true, fig: 'plantXY', q: 'في الشكل: الرمز (ص) يشير إلى الماء الذي تمتصّه الجذور من التربة.', a: 'صواب', why: 'الجذور تمتصّ الماء من التربة، ثم يصعد إلى الأوراق.' },
  { id: 'b1', lv: 1, q: 'من أين يحصل النبات على الماء؟', opts: ['من التربة عن طريق الجذور', 'من الهواء عن طريق الأوراق', 'من ضوء الشمس', 'من الأزهار'], a: 'من التربة عن طريق الجذور', why: 'الجذور تمتصّ الماء من التربة.' },
  { id: 'b2', lv: 1, q: 'من أين يحصل النبات على ثاني أكسيد الكربون؟', opts: ['من الهواء', 'من التربة', 'من الماء', 'من الشمس'], a: 'من الهواء', why: 'ثاني أكسيد الكربون غاز في الهواء، يدخل إلى النبات عن طريق الأوراق.' },
  { id: 'b3', lv: 1, tf: true, q: 'يستطيع النبات أن يصنع غذاءه في الظلام التام إذا توفّر له الماء.', a: 'خطأ', why: 'الماء وحده لا يكفي؛ النبات يحتاج إلى طاقة الضوء ليصنع غذاءه.' },
  { id: 'b4', lv: 2, fig: 'plantXY', q: 'في الشكل، يشير الرمز (س) إلى مادة تدخل الورقة من الهواء ويحتاج إليها النبات في التمثيل الضوئي. ما هذه المادة؟', opts: ['ثاني أكسيد الكربون', 'الأكسجين', 'الماء', 'الغذاء'], a: 'ثاني أكسيد الكربون', why: 'الغاز الذي يدخل الورقة من الهواء ويحتاج إليه النبات هو ثاني أكسيد الكربون.' },
  { id: 'b5', lv: 2, fig: 'plantXY', q: 'في الشكل، يشير الرمز (ص) إلى مادة تمتصّها الجذور من التربة. ما هذه المادة؟', opts: ['الماء', 'ثاني أكسيد الكربون', 'الأكسجين', 'الضوء'], a: 'الماء', why: 'الجذور تمتصّ الماء من التربة، ثم يصعد إلى الأوراق.' },
  { id: 'b6', lv: 2, fix: true, q: 'صحّح خطأ زميلك: قال سعيد «يأخذ النبات الماء من الهواء عن طريق أوراقه». ما التصحيح؟', opts: ['يأخذ الماء من التربة عن طريق الجذور', 'يأخذ الماء من الضوء عن طريق الأوراق', 'يصنع النبات الماء بنفسه داخل الأوراق', 'كلامه صحيح، فالأوراق تمتصّ الماء من الهواء'], a: 'يأخذ الماء من التربة عن طريق الجذور', why: 'الماء يأتي من التربة، والجذور تمتصّه. أما الأوراق فيدخل منها ثاني أكسيد الكربون.' },
  { id: 'b7', lv: 2, q: 'زرع ناصر بذورًا في وعاءين متماثلين، ووضع وعاءً في صندوق مظلم والآخر في مكان مضيء، وسقاهما بالكمية نفسها من الماء. ما الشيء الوحيد المختلف بين الوعاءين؟', opts: ['الضوء', 'كمية الماء', 'درجة الحرارة', 'نوع البذور'], a: 'الضوء', why: 'في الاختبار العادل نغيّر شيئًا واحدًا فقط، وهنا هو الضوء.' },
  { id: 'b8', lv: 2, q: 'أراد سعيد أن يعرف هل يحتاج النبات إلى الضوء، فزرع بذورًا في وعاءين: واحد في الظلام وواحد في الضوء. لماذا يجب أن يسقي الوعاءين بالكمية نفسها من الماء؟', opts: ['ليكون الضوء هو الشيء الوحيد المختلف بينهما', 'لأن الماء يصنع الضوء الذي يحتاج إليه النبات', 'حتى تنمو بذور الظلام أسرع من بذور الضوء', 'لا يهمّ مقدار الماء، فالمهمّ هو الضوء فقط'], a: 'ليكون الضوء هو الشيء الوحيد المختلف بينهما', why: 'لو اختلف الماء أيضًا، لما عرفنا هل الفرق بسبب الضوء أم بسبب الماء.' },
  { id: 'b9', lv: 2, fig: 'seedAB', q: 'يوضّح الشكل بادرات (نباتات صغيرة) نمت في وعاءين بعد يومين: أحدهما كان في الظلام والآخر في الضوء. أيّ الوعاءين كان في الظلام؟', opts: ['الوعاء (أ)، لأن بادراته شاحبة صفراء ورفيعة', 'الوعاء (ب)، لأن بادراته خضراء قوية', 'الوعاء (أ)، لأن بادراته أطول فهي أقوى', 'لا يمكن معرفة ذلك من الشكل'], a: 'الوعاء (أ)، لأن بادراته شاحبة صفراء ورفيعة', why: 'في الظلام لا تصنع البادرات غذاءً جديدًا، فتصبح شاحبة صفراء رفيعة رغم طولها.' },
  { id: 'b10', lv: 3, q: 'زرع خالد بذورًا في وعاءين، ووضع وعاءً في صندوق مظلم والآخر في مكان مضيء، وسقاهما بالكمية نفسها. بعد يومين نبتت البذور وظهرت نباتات صغيرة (بادرات). كيف تتوقع أن تبدو البادرات التي في الصندوق المظلم؟', opts: ['شاحبة صفراء ورفيعة', 'خضراء وأقوى من بادرات المكان المضيء', 'مثل بادرات المكان المضيء تمامًا', 'تحوّلت إلى ثمار'], a: 'شاحبة صفراء ورفيعة', why: 'بلا ضوء لا تصنع البادرات غذاءً جديدًا، فتضعف ويشحب لونها.' },
  { id: 'b11', lv: 3, q: 'وضع أحمد المجموعة الأولى من البادرات في الضوء عند ٢٥ °س، والثانية في الظلام عند ٣٢ °س. ما المشكلة في تجربته؟', opts: ['غيّر الضوء والحرارة معًا، فلا نعرف سبب الفرق', 'لا توجد مشكلة، فالتجربة عادلة كما هي', 'كان عليه وضع المجموعتين في الظلام معًا', 'الحرارة لا تؤثّر في النبات، فلا داعي لتثبيتها'], a: 'غيّر الضوء والحرارة معًا، فلا نعرف سبب الفرق', why: 'في الاختبار العادل نغيّر شيئًا واحدًا فقط، ونثبّت كل شيء آخر.' },
  { id: 'b12', lv: 3, q: 'غطّى مزارع في الباطنة شتلات صغيرة بغطاء أسود لا يمرّ منه الضوء أسبوعًا كاملًا، مع سقيها كل يوم. ماذا تتوقع ولماذا؟', opts: ['تضعف، لأنها لا تحصل على الضوء فلا تصنع غذاءها', 'تنمو أسرع لأنها في الظل', 'لا تتأثر لأن الماء متوفّر', 'تضعف، لأن الغطاء يمنع وصول الماء إلى الجذور'], a: 'تضعف، لأنها لا تحصل على الضوء فلا تصنع غذاءها', why: 'الماء وحده لا يكفي؛ الضوء ضروري لصنع الغذاء.' },
  { id: 'b13', lv: 3, fig: 'tubes', q: 'وُضعت الأنابيب الأربع في الشكل تحت ضوء الشمس عدة ساعات. في أيّ أنبوبة يحدث التمثيل الضوئي؟', opts: ['الأنبوبة (أ)، لأن فيها ضوءًا وماءً وثاني أكسيد الكربون', 'الأنبوبة (ب)، لأن الغطاء الأسود يحفظ الحرارة للورقة', 'الأنبوبة (ج)، لأن المادة فيها تنظّف الهواء للورقة', 'الأنبوبة (د)، لأن فيها ماءً أكثر من غيرها'], a: 'الأنبوبة (أ)، لأن فيها ضوءًا وماءً وثاني أكسيد الكربون', why: 'في (ب) لا ضوء، وفي (ج) لا ثاني أكسيد الكربون، وفي (د) لا توجد ورقة أصلًا.' },
  { id: 'b14', lv: 3, fig: 'tubes', q: 'لماذا لا يحدث التمثيل الضوئي في الأنبوبة (ج) الموضّحة في الشكل، رغم أنها في الضوء؟', opts: ['لأن المادة فيها تمتصّ ثاني أكسيد الكربون من الورقة', 'لأنها لا تحتوي على أي ماء تحتاج إليه الورقة', 'لأن الورقة فيها صفراء وليست خضراء', 'لأن الضوء لا يصل إليها بسبب لون المادة'], a: 'لأن المادة فيها تمتصّ ثاني أكسيد الكربون من الورقة', why: 'ثاني أكسيد الكربون من المواد التي يحتاج إليها النبات، فإذا غاب توقّف التمثيل الضوئي.' },
  { id: 'b15', lv: 3, q: 'تريد أن تختبر هل يحتاج النبات إلى ثاني أكسيد الكربون. أيّ تجربة هي الأفضل؟', opts: ['ورقتان في الضوء: إحداهما مع مادة تمتصّ الغاز والأخرى بدونها', 'ورقة في الضوء مع المادة، وورقة في الظلام بدونها', 'ورقة واحدة فقط في الضوء، ومعها المادة التي تمتصّ الغاز', 'ورقتان من نباتين مختلفين، واحدة في الشمس وواحدة في الظل'], a: 'ورقتان في الضوء: إحداهما مع مادة تمتصّ الغاز والأخرى بدونها', why: 'نغيّر شيئًا واحدًا (وجود ثاني أكسيد الكربون) ونثبّت الباقي، ونقارن بمجموعة لم نغيّر فيها شيئًا.' }
],
s3: [
  { id: 'c16', lv: 1, tf: true, q: 'الضوء من نواتج التمثيل الضوئي.', a: 'خطأ', why: 'الضوء طاقة تشغّل العملية، والنواتج هي الغذاء والأكسجين.' },
  { id: 'c17', lv: 2, tf: true, q: 'يستخدم النبات بعض الغذاء الذي يصنعه في بناء خلايا وأنسجة جديدة.', a: 'صواب', why: 'وهكذا تزداد كتلته الحيوية.' },
  { id: 'c18', lv: 2, tf: true, fig: 'bubbleGraph', q: 'من الرسم البياني: كلما ابتعد المصباح عن النبات زاد عدد الفقاعات.', a: 'خطأ', why: 'العكس: كلما ابتعد المصباح قلّ الضوء، فقلّت الفقاعات (من ٤٤ إلى ٨).' },
  { id: 'c1', lv: 1, q: 'ماذا يصنع النبات في التمثيل الضوئي؟', opts: ['غذاءً وأكسجين', 'ماءً وثاني أكسيد الكربون', 'تربةً وماءً', 'ضوءًا وحرارة'], a: 'غذاءً وأكسجين', why: 'نواتج التمثيل الضوئي: الغذاء والأكسجين.' },
  { id: 'c2', lv: 1, q: 'ما الغاز الذي يطلقه النبات في التمثيل الضوئي؟', opts: ['الأكسجين', 'ثاني أكسيد الكربون', 'النيتروجين', 'بخار الماء'], a: 'الأكسجين', why: 'النبات يطلق الأكسجين إلى الهواء.' },
  { id: 'c3', lv: 1, fig: 'eqBlank', q: 'ما المادة الناقصة مكان علامة (؟) في المعادلة اللفظية الموضّحة في الشكل؟', opts: ['أكسجين', 'ماء', 'ضوء', 'تربة'], a: 'أكسجين', why: 'ماء + ثاني أكسيد الكربون ← غذاء + أكسجين.' },

(function () {
  const attach = (q, list) => { if (!q || !list || q.tf) return; q.wr = {}; q.opts.filter(o => o !== q.a).forEach((o, i) => { if (list[i]) q.wr[o] = list[i]; }); };
  STATIONS.forEach(S0 => {
    S0.bank.forEach(q => attach(q, WR[q.id]));
    attach(S0.simple.check, WR[S0.id + '-x']);
    S0.slides.forEach((sl, k) => sl.check && attach(sl.check, WR[S0.id + '-' + k]));
  });
  LABS.forEach(l => attach(l.q, WR['lab-' + l.id]));
})();

  const unusedFirst = (x, y) => (s.used.includes(x.id) ? 1 : 0) - (s.used.includes(y.id) ? 1 : 0);
  const tf = shuffle(S0.bank.filter(q => q.tf)).sort(unusedFirst)[0];
  if (tf) { chosen.push(tf); plan.splice(plan.indexOf(tf.lv), 1); }
  plan.forEach(lv => {
    const pool = shuffle(S0.bank.filter(q => q.lv === lv && !chosen.includes(q)));
    pool.sort((a, b) => (s.used.includes(a.id) ? 1 : 0) - (s.used.includes(b.id) ? 1 : 0));
    chosen.push(pool[0]);

}
function startFinal() {

function reportData() {
  const all = [];

  ((S.o.final || {}).hist || []).forEach(a => a.res.forEach(r => all.push([r[0], r[1], a.t])));
  const lv = { 1: [0, 0], 2: [0, 0], 3: [0, 0] };
  all.forEach(([id, ok]) => { const q = QBY[id]; if (q) { lv[q.lv][1]++; lv[q.lv][0] += ok; } });
  const latest = {}; all.sort((a, b) => a[2] - b[2]).forEach(([id, ok]) => latest[id] = ok);
  const weak = Object.keys(latest).filter(id => !latest[id] && QBY[id]).map(id => QBY[id]).slice(-5);
  return { lv, weak, n: all.length };
}

const winBox = (stars, msg, id) => `<div class="why good center" style="margin-top:10px"><div class="stars">${starsOf(stars)}</div>${msg}<br><button class="btn sec" data-act="game" data-id="${id}" style="margin-top:8px">العب مرة أخرى</button></div>`;

  chains() {

      const ch = rounds[r], sh = draw.sh;

        <div class="pool">${sh.map(k => pk.includes(k) ? '' : `<button class="word" data-k="${k}">${ch[k]}</button>`).join('')}</div>`;
    };
    const start = () => { pk = []; let s; do { s = shuffle(rounds[r].map((_, k) => k)); } while (s.every((v, k) => v === k)); draw.sh = s; $('#cr').textContent = ar(r + 1) + '/' + ar(rounds.length); $('#cfb').innerHTML = ''; draw(); };
    $('#cbox').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || draw.lock) return; const ch = rounds[r], k = +b.dataset.k;
      if (b.dataset.u) { if (pk[k] != null) { pk[k] = null; draw(); } return; }

      if (ch.every((_, j) => pk[j] != null)) {

        timers.push(setTimeout(() => { draw.lock = false; r++; if (r < rounds.length) start(); else { const s = score === rounds.length ? 3 : score >= rounds.length - 1 ? 2 : score ? 1 : 0; bestStars('chains', s); $('#cbox').innerHTML = ''; $('#cfb').innerHTML = winBox(s, `رتّبت ${ar(score)} من ${ar(rounds.length)} سلاسل بشكل صحيح.`, 'chains'); } }, ok ? 1300 : 2600));

      else { b.classList.add('wrong'); b.disabled = true; $('#tfb').innerHTML = '<div class="why bad">فكّر مرة أخرى في سؤال التخطيط: التجربة العادلة تغيّر شيئًا واحدًا وتقيس أثره.</div>'; } });
    draw();
  }
});

/* =========================================================
   أدوات عامة (من الدرس ١-٧): رسوم ومختبرات تُعرَّف من data.js
   - XART / XFIG / XLAB في data.js دوالّ تأخذ الأدوات H وتعيد كائنًا يُدمج في ART / FIG / LAB.
   - المختبرات العامة: في LABS ضع kind (steps | match | sim | sort | reveal) و cfg بدل كتابة مختبر في المحرّك.
   ========================================================= */
const ftable = (head, rows) => `<table class="ftab">${head ? `<tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>` : ''}${rows.map(r => `<tr>${r.map((c, i) => !head && i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const emoArt = (s, cap) => `<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:42px;line-height:1.2">${s}</div>${cap ? `<div class="cap">${cap}</div>` : ''}`;
const cardsArt = list => `<div class="grid">${list.map(([i, t]) => `<div class="opt" style="cursor:default">${i} ${t}</div>`).join('')}</div>`;
const H = { ar, shuffle, chain: chainRow, bars: groupedBars, line: lineRTL, table: ftable, emo: emoArt, cards: cardsArt, $, $$, toast, timers };
const GLAB = {
  steps(root, ready, c) {
    let i = 0;
    root.innerHTML = `<p>${c.intro}</p>${c.art ? `<div class="art" id="gsv">${c.art(0)}</div>` : ''}<div class="grid">${shuffle(c.steps.map((s, k) => [k, s[0]])).map(([k, t]) => `<button class="opt" data-gk="${k}">${t}</button>`).join('')}</div><div id="gsf"></div>`;
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-gk]'); if (!b || i >= c.steps.length) return;
      if (+b.dataset.gk !== i) { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); $('#gsf', root).innerHTML = `<div class="why bad">${c.wrong || 'ليست هذه الخطوة الآن. فكّر: ماذا يجب أن يحدث قبلها؟'}</div>`; return; }
      b.classList.remove('wrong'); b.classList.add('right'); b.disabled = true; i++;
      if (c.art) $('#gsv', root).innerHTML = c.art(i);
      $('#gsf', root).innerHTML = `<div class="why good">✓ ${c.steps[i - 1][1] || 'صحيح.'}${i === c.steps.length && c.end ? '<br>' + c.end : ''}</div>`;
      if (i === c.steps.length) ready();
    });
  },
  match(root, ready, c) {
    const done = new Set(); let cur = null;
    root.innerHTML = `<p>${c.intro}</p><div class="grid">${c.items.map((s, k) => `<button class="opt" data-gi="${k}">${s[0]}</button>`).join('')}</div><div id="gmq"></div><div id="gmf"></div><div class="center">مكتمل: <b class="gmn">٠</b> من ${ar(c.items.length)}</div>`;
    root.addEventListener('click', e => {
      const s = e.target.closest('[data-gi]'), f = e.target.closest('[data-go]');
      if (s) { cur = +s.dataset.gi; $('#gmq', root).innerHTML = `<p><b>${c.items[cur][1]}</b></p><div class="grid">${shuffle(c.opts).map(o => `<button class="opt" data-go="${o}">${o}</button>`).join('')}</div>`; $('#gmf', root).innerHTML = ''; return; }
      if (f && cur != null) {
        const it = c.items[cur];
        if (f.dataset.go === it[2]) { done.add(cur); $(`[data-gi="${cur}"]`, root).classList.add('right'); $('#gmf', root).innerHTML = `<div class="why good">✓ ${it[3] || ''}</div>`; $('#gmq', root).innerHTML = ''; $('.gmn', root).textContent = ar(done.size); cur = null; if (done.size === c.items.length) { if (c.end) $('#gmf', root).innerHTML += `<div class="why good">${c.end}</div>`; ready(); } }
        else { f.classList.add('wrong'); f.disabled = true; $('#gmf', root).innerHTML = `<div class="why bad">${c.wrong || 'فكّر مرة أخرى 🤔'}</div>`; }
      }
    });
  },
  sim(root, ready, c) {
    const R = {}; let v = null, busy = false; const need = c.need || 3;
    root.innerHTML = `<p>${c.intro}</p><p><b>${c.ask}</b></p><div class="opts tf" style="grid-template-columns:repeat(${Math.min(c.vals.length, 4)},1fr)">${c.vals.map(x => `<button class="opt" data-gv="${x}" style="white-space:nowrap;padding-inline:4px">${c.label(x)}</button>`).join('')}</div>${c.show ? `<div class="art" id="gss">${c.show(null, 0)}</div>` : ''}<button class="btn full warm" id="gsg" disabled>${c.go || '▶️ نفّذ'}</button><div id="gsr"></div><div class="art" id="gsc"></div><ul class="tasks"><li class="gst">جرّب ${ar(need)} قيم مختلفة على الأقل</li></ul>`;
    $$('[data-gv]', root).forEach(b => b.onclick = () => { if (busy) return; v = b.dataset.gv; $$('[data-gv]', root).forEach(x => x.classList.toggle('sel', x === b)); $('#gsg', root).disabled = false; if (c.show) $('#gss', root).innerHTML = c.show(v, 0); });
    $('#gsg', root).onclick = () => {
      if (busy || v == null) return; busy = true; let t = 0;
      const iv = setInterval(() => { t = Math.min(1, t + 0.1); if (c.show) $('#gss', root).innerHTML = c.show(v, t); if (t >= 1) { clearInterval(iv); busy = false; R[v] = c.res[v];
        $('#gsr', root).innerHTML = `<div class="why good">${c.say ? c.say(v, c.res[v]) : `${c.label(v)}: <b>${ar(c.res[v])} ${c.unit || ''}</b>`}</div>`;
        const ks = c.vals.filter(x => R[x] != null);
        $('#gsc', root).innerHTML = groupedBars(ks.map(x => [c.label(x), [R[x]]]), c.max, c.step || 4, c.lstep || 8, c.axis);
        if (ks.length >= need) { $('.gst', root).classList.add('done'); if (c.end) $('#gsr', root).innerHTML += `<div class="why good">🔎 ${c.end}</div>`; ready(); } } }, 110); timers.push(iv);
    };
  },
  sort(root, ready, c) {
    const ok = new Set();
    root.innerHTML = `<p>${c.intro}</p>${shuffle(c.items.map((x, k) => [x, k])).map(([x, k]) => `<div class="sortrow" data-gr="${k}"><span>${x[0]}</span><span class="b2"><button data-gb="0">${c.b[0]}</button><button data-gb="1">${c.b[1]}</button></span></div>`).join('')}<div id="gtf"></div>`;
    root.style.textAlign = 'start';
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-gb]'); if (!b) return; const row = b.closest('.sortrow'), k = +row.dataset.gr, it = c.items[k];
      if (ok.has(k)) return;
      if (+b.dataset.gb === it[1]) { ok.add(k); row.classList.add('ok'); $('.b2', row).innerHTML = c.b[it[1]]; $('#gtf', root).innerHTML = it[2] ? `<div class="why good">✓ ${it[2]}</div>` : ''; if (ok.size === c.items.length) { if (c.end) $('#gtf', root).innerHTML = `<div class="why good">${c.end}</div>`; ready(); } }
      else { row.classList.remove('no'); void row.offsetWidth; row.classList.add('no'); $('#gtf', root).innerHTML = `<div class="why bad">${it[3] || 'فكّر مرة أخرى 🤔'}</div>`; }
    });
  },
  reveal(root, ready, c) {
    const seen = new Set();
    root.innerHTML = `<p>${c.intro}</p>${c.art ? `<div class="art">${c.art()}</div>` : ''}<div class="grid">${c.cards.map((x, k) => `<button class="opt" data-gc="${k}">${x[0]}</button>`).join('')}</div><div id="gcf"></div><div class="center">اكتشفت: <b class="gcn">٠</b> من ${ar(c.cards.length)}</div>`;
    root.addEventListener('click', e => { const b = e.target.closest('[data-gc]'); if (!b) return; const k = +b.dataset.gc; seen.add(k); b.classList.add('right');
      $('#gcf', root).innerHTML = `<div class="why good"><b>${c.cards[k][0]}</b><br>${c.cards[k][1]}</div>`; $('.gcn', root).textContent = ar(seen.size);
      if (seen.size === c.cards.length) { if (c.end) $('#gcf', root).innerHTML += `<div class="why good">${c.end}</div>`; ready(); } });
  }
};
if (typeof XART === 'function') Object.assign(ART, XART(H));
if (typeof XFIG === 'function') Object.assign(FIG, XFIG(H));
if (typeof XLAB === 'function') Object.assign(LAB, XLAB(H));
LABS.forEach(L => { if (!LAB[L.id] && L.kind) LAB[L.id] = (root, ready) => GLAB[L.kind](root, ready, typeof L.cfg === 'function' ? L.cfg(H) : L.cfg); });

/* =========================================================
   الأحداث
   ========================================================= */
const ACT = {
  home: () => go(viewHome),
  open: d => go(viewStation, d.id),
  go: d => openTarget(d.id),
  more: d => {
    const s = st(d.id), same = V.v === 'st' && V.sid === d.id;
    if (s.open < LAYERS.length) s.open++;
    s.maxOpen = Math.max(s.maxOpen || 0, s.open);
    if (s.review) { s.review = false; toast('أحسنت! بعد القراءة صار بإمكانك أخذ اختبار جديد'); }
    save();
    if (same) viewStation(d.id, s.open - 1);
    else { go(viewStation, d.id); const el = $('#layer' + (s.open - 1)); if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); }
  },
  less: d => {
    const s = st(d.id); s.open = Math.max(0, s.open - 1); save(); clearTimers(); viewStation(d.id);
    const n = $('.navrow'); if (n) n.scrollIntoView({ block: 'end' });
  },
  quiz: d => startQuiz(d.id),
  ans: d => answer(+d.k),
  qnext: () => qNext(),
  quitq: () => { if (Q && Q.kind === 'st') go(viewStation, Q.sid); else go(viewFinal); },
  'final-start': () => startFinal(),
  finmore: () => go(viewPractice),
  finless: () => { S.o.finOpen = false; save(); viewFinal(); const n = $('.navrow'); if (n) n.scrollIntoView({ block: 'end' }); },
  lab: d => go(viewLab, d.id),
  game: d => openGame(d.id),
  resume: () => { const l = S.o.loc; if (!l) return; if (l.v === 'st') go(viewStation, l.a); else if (l.v === 'lab') go(viewLab, l.a); else openTarget(l.v); },
  chk: (d, b) => {
    const { c, opts, sid, k } = V.chk[d.id], choice = opts[+d.k], box = b.closest('.check');
    if (choice === c.a) {
      $$('.opt', box).forEach(x => x.disabled = true); b.classList.add('right');
      $('#ckWhy-' + d.id).innerHTML = `<div class="why good">✓ ${c.why}</div>`; st(sid).chk[k] = true; save(); refreshCard(sid);
    } else { b.classList.add('wrong'); b.disabled = true; $('#ckWhy-' + d.id).innerHTML = `<div class="why bad">✗ ${(c.wr && c.wr[choice]) || 'ليست هذه.'} فكّر مرة أخرى 🤔</div>`; }
  },
  obs: (d, b) => {
    const id = d.id, opts = V.obs[id], q = LBY[id].q, choice = opts[+d.k], box = $('#obs-' + id);
    if (choice === q.a) {
      $$('.opt', box).forEach(x => x.disabled = true); b.classList.add('right');
      $('#obsWhy-' + id).innerHTML = `<div class="why good">✓ ${q.why}</div>`;
      if (!labSt(id).done) { labSt(id).done = true; save(); toast('🧪 أنجزت هذا المختبر!'); }
    } else { b.classList.add('wrong'); b.disabled = true; $('#obsWhy-' + id).innerHTML = `<div class="why bad">✗ ${(q.wr && q.wr[choice]) || ''} راجع ما حدث في المختبر، وحاول مرة أخرى 🤔</div>`; }
  },
  exans: (d, b) => {
    const k = +d.k, box = $('#exa' + k); box.hidden = !box.hidden;
    b.textContent = box.hidden ? '👁️ أظهر نموذج الإجابة' : 'أخفِ نموذج الإجابة';
    const s = new Set(S.o.exSeen || []); if (!box.hidden && !s.has(k)) { s.add(k); S.o.exSeen = [...s]; save(); }
  },
  zoom: (d, b) => {
    const m = document.createElement('div'); m.className = 'modal zoom';
    m.innerHTML = `<div class="zbox"><img src="${b.src}" alt=""></div><button class="btn" data-act="unzoom">✕ إغلاق</button>`;
    document.body.appendChild(m);
  },
  reset: () => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="panel"><div class="salem"><img src="${salem('think')}" alt="سالم"><p class="bubble">هل تريد أن تبدأ الدرس من جديد؟ سيُمسح كل تقدّمك: الدرجات، والمختبرات، ونجوم الألعاب.</p></div>
      <button class="btn full warm" data-act="reset-yes">نعم، ابدأ من الصفر</button><button class="btn sec full" data-act="unzoom">لا، تراجع</button></div>`;
    document.body.appendChild(m);
  },
  'reset-yes': () => { Object.keys(S.o).forEach(k => delete S.o[k]); try { localStorage.removeItem(LESSON.key); } catch (e) {} go(viewHome); toast('بدأت الدرس من جديد 🌱'); },
  report: () => go(viewReport),
  ffill: d => fFill(+d.k), fpick: d => fPick(+d.k), funpick: d => fUnpick(+d.k), frow: d => fRow(+d.r, +d.k),
  copyrep: () => { try { navigator.clipboard.writeText(reportText()).then(() => toast('نُسخ التقرير ✓ الصقه في واتساب'), () => toast('تعذّر النسخ على هذا الجهاز')); } catch (e) { toast('تعذّر النسخ على هذا الجهاز'); } },
  unzoom: () => $$('.modal').forEach(m => m.remove())
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b.dataset, b);
});
viewHome();
})();

</script>
