<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التمثيل الضوئي ١-١ · القرية التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F5EC;--surface:#fff;--surface-2:#E7EEDF;--ink:#152B1C;--muted:#58705E;--line:#D3DECB;
  --leaf:#2E8B47;--leaf-deep:#1C5A2E;--leaf-soft:#DDEFD9;--sun:#D9920F;--sun-soft:#FBEFD2;
  --water:#2A74B5;--water-soft:#DCEAF6;--air:#7A5BB5;--air-soft:#ECE5F7;
  --good:#2E8B47;--good-soft:#DDEFD9;--bad:#C0392B;--bad-soft:#F8DEDA;
  --r:18px;--shadow:0 6px 20px rgba(21,43,28,.08);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Kufi Arabic",Tahoma,sans-serif;
}
[data-theme=dark]{--bg:#0F1A13;--surface:#16241B;--surface-2:#1E3025;--ink:#E6F0E8;--muted:#9DB5A3;--line:#2B4033;--leaf-soft:#1F3A28;--sun-soft:#3A2F14;--water-soft:#152B3D;--air-soft:#2A2340;--good-soft:#1F3A28;--bad-soft:#3D1F1B}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.85;padding-bottom:40px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.5;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
.en{font-family:Georgia,serif;font-weight:700;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:860px;margin-inline:auto;padding-inline:16px}

/* الهيدر */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.badge{font-family:var(--f-display);font-weight:800;color:#fff;background:var(--leaf);border-radius:12px;padding:2px 10px;font-size:15px}
.top h1{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.houses{display:flex;gap:3px;align-items:center;font-size:18px}
.houses span{opacity:.22;filter:grayscale(1);transition:all .4s}
.houses span.on{opacity:1;filter:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* عام */
.screen{animation:in .4s both;padding-top:18px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 22px;font:700 16px var(--f-display);background:var(--leaf);color:#fff;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.sun{background:var(--sun)}
.btn.ghost{background:transparent;color:var(--leaf);border:1.5px solid var(--leaf)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.lead{color:var(--muted);margin:4px 0 14px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--leaf-soft);color:var(--leaf-deep)}
mark{background:var(--sun-soft);color:inherit;padding:0 4px;border-radius:6px}
.term{color:var(--leaf);font-weight:700}

/* سالم */
.guide{display:flex;gap:12px;align-items:flex-end;margin:6px 0 16px}
.guide img{width:86px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--leaf);border-radius:20px 20px 20px 6px;padding:12px 16px;box-shadow:var(--shadow);flex:1}
.bubble b.name{display:block;font-family:var(--f-display);color:var(--leaf);font-size:14px}
.bubble p{margin:2px 0 0}

/* البداية */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:250px;display:flex;align-items:flex-end;box-shadow:var(--shadow);background:var(--leaf-deep)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,26,14,.9) 12%,rgba(8,26,14,.25) 70%,transparent)}
.hero .in{position:relative;z-index:1;color:#fff;padding:22px}
.hero h2{font-size:30px}
.hero p{margin:4px 0 0;opacity:.9}
.riddle{border-radius:var(--r);background:var(--sun-soft);border:2px dashed var(--sun);padding:16px 18px}
.riddle h3{font-size:16px;color:var(--sun)}
.goals{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.goals li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.goals .n{flex:none;width:38px;height:38px;border-radius:12px;background:var(--leaf);color:#fff;display:grid;place-items:center;font:800 17px var(--f-display)}

/* الأسئلة */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.q .qt{font-weight:700;margin-bottom:10px}
.q .qt small{display:block;font-weight:600;color:var(--air);font-size:13px}
.opts{display:grid;gap:8px}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15.5px;transition:all .2s}
.opt.sel{border-color:var(--water);background:var(--water-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(4px)}75%{transform:translateX(-4px)}}
.why{margin-top:10px;font-size:15px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.score{font:800 22px var(--f-display)}

/* الخريطة */
.village{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);background:#fdf3dc}
.village svg{display:block;width:100%;height:auto}
.vpart{transition:opacity .6s,transform .6s;transform-box:fill-box;transform-origin:bottom}
.vpart.off{opacity:.08;transform:scale(.6)}
.path{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.station{display:flex;gap:14px;align-items:center;text-align:start;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.station .ic{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--surface-2)}
.station b{display:block;font-family:var(--f-display);font-size:16px}
.station small{color:var(--muted);font-size:13.5px;line-height:1.6;display:block}
.station .st{margin-inline-start:auto;font-size:13px;font-weight:700;white-space:nowrap}
.station.locked{opacity:.5;cursor:not-allowed}
.station.open{border-color:var(--sun)}
.station.open .ic{background:var(--sun-soft)}
.station.done{border-color:var(--leaf)}
.station.done .ic{background:var(--leaf-soft)}

/* المحطة */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);border-radius:16px;padding:5px;margin-bottom:16px}
.steps button{border:0;background:transparent;border-radius:12px;padding:8px 4px;font:700 14px var(--f-display);color:var(--muted)}
.steps button.cur{background:var(--surface);color:var(--leaf);box-shadow:var(--shadow)}
.steps button.done::after{content:" ✓";color:var(--leaf)}
.steps button[disabled]{opacity:.45}
.reveal{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;transition:all .35s}
.rv.off{opacity:.18;filter:blur(1.5px)}
.rv .d{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sun-soft);color:var(--sun);display:grid;place-items:center;font:800 14px var(--f-display)}
.rv p{margin:0}
.fig{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.fig figcaption{text-align:center;font-size:14px;color:var(--muted);margin-top:6px}
.split{display:flex;gap:10px;justify-content:center;direction:ltr;flex-wrap:wrap}
.piece{direction:rtl;flex:1 1 140px;max-width:220px;border:2px dashed var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:center}
.piece .en{font-size:26px;display:block}
.piece .ar{display:block;font:700 18px var(--f-display);color:var(--leaf);opacity:0;transition:opacity .3s}
.piece.open{border-style:solid;border-color:var(--leaf)}
.piece.open .ar{opacity:1}
.def{border-radius:var(--r);background:var(--leaf-deep);color:#fff;padding:16px 18px}
.def h4{color:#BDE5C4;font-size:14px}
.diagram{position:relative;max-width:380px;margin-inline:auto}
.diagram img{border-radius:14px}
.hot{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:3px solid #fff;color:#fff;font:800 16px var(--f-display);box-shadow:0 2px 10px rgba(0,0,0,.25);animation:pulse 1.8s infinite}
.hot.seen{animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(217,146,15,.0),0 0 0 0 rgba(217,146,15,.4)}0%{box-shadow:0 0 0 0 rgba(217,146,15,.5)}}
.info{border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);min-height:90px}
.flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.chip{border-radius:12px;padding:6px 12px;font:700 15px var(--f-display);border:1.5px solid}
.chip.w{color:var(--water);background:var(--water-soft)}.chip.c{color:var(--air);background:var(--air-soft)}.chip.f{color:var(--leaf);background:var(--leaf-soft)}.chip.o{color:var(--sun);background:var(--sun-soft)}
.op{font-weight:800;color:var(--muted)}
.arrow{font-size:12px;color:var(--sun);font-weight:700;text-align:center}
.bsteps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center}
.bstep{border-radius:16px;padding:12px;text-align:center;background:var(--surface);border:1px solid var(--line);opacity:.3;transition:all .4s;font-size:14px}
.bstep b{display:block;font-family:var(--f-display);font-size:15px}
.bstep.on{opacity:1;border-color:var(--leaf);box-shadow:var(--shadow)}
.alt{border-radius:var(--r);border:2px solid var(--air);background:var(--air-soft);padding:16px}
.alt h4{color:var(--air)}
.feedback{border-radius:14px;padding:12px 14px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--surface-2)}

.dots{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.dots i{width:26px;height:6px;border-radius:99px;background:var(--line);transition:background .3s}.dots i.on{background:var(--leaf)}
/* المختبرات */
.chainrow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.org{width:72px;border:2px solid transparent;border-radius:14px;background:transparent;padding:4px;text-align:center;font:700 13px var(--f-display)}
.org img{background:#fff;border-radius:10px}
.org.lit{border-color:var(--sun);background:var(--sun-soft)}
.org.right{border-color:var(--good);background:var(--good-soft)}
.org.wrong{border-color:var(--bad);animation:shake .4s}
.cha{color:var(--muted);font-weight:800;transition:color .3s}
.cha.lit{color:var(--sun)}
.sunball{width:42px;height:42px;border-radius:50%;background:radial-gradient(#ffe27a,#f2a20c);box-shadow:0 0 18px #f2c94c}
.inp{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--surface)}
.inp.on{border-color:var(--leaf);background:var(--leaf-soft)}
.inp h4{font-size:15px;margin-bottom:6px}
.inp .opts{grid-template-columns:repeat(3,1fr)}
.stage{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#fff;max-width:340px;margin-inline:auto}
.stage img{transition:filter .6s}
.stage.dim img{filter:grayscale(.7) brightness(.8)}
.outs{display:flex;gap:8px;justify-content:center;padding:10px;background:var(--surface-2)}
.outs span{opacity:.25;font:700 14px var(--f-display);padding:6px 12px;border-radius:12px;background:var(--surface);transition:all .4s}
.outs span.on{opacity:1;box-shadow:0 0 0 3px var(--sun)}
.bub{position:absolute;bottom:62%;width:10px;height:10px;border-radius:50%;border:2px solid #7fb6e0;background:rgba(255,255,255,.6);animation:rise 2.6s ease-out forwards}
@keyframes rise{to{transform:translateY(-140px);opacity:0}}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bucket{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:110px;background:var(--surface);text-align:center}
.bucket h4{font-size:15px;margin-bottom:6px}
.bucket.target{border-color:var(--sun);background:var(--sun-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;min-height:44px}
.word{display:inline-block;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-weight:700;font-size:14.5px;margin:3px}
.word.picked{border-color:var(--sun);background:var(--sun-soft)}
.word.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}

/* النهاية */
.badgebig{width:130px;height:130px;margin:0 auto;border-radius:50%;background:radial-gradient(#ffe27a,#d9920f);display:grid;place-items:center;font-size:58px;box-shadow:0 0 0 8px var(--sun-soft)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.compare div{border-radius:16px;padding:14px;background:var(--surface);border:1px solid var(--line)}
.compare b{display:block;font:800 30px var(--f-display)}
.rate{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.rate .opt{flex:1;text-align:center;font-size:14px}
.cert{border:6px double var(--sun);border-radius:20px;padding:22px;text-align:center;background:var(--surface)}
.cert h3{font-size:22px;color:var(--leaf)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:99;font-weight:600;animation:in .3s}
.foot{text-align:center;color:var(--muted);font-size:13.5px;margin-top:30px}
.foot a{color:inherit}
@media (max-width:520px){.hero h2{font-size:25px}.bsteps{grid-template-columns:1fr}.bsteps .arw{transform:rotate(-90deg);justify-self:center}.inp .opts{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <span class="badge">١-١</span>
  <h1>التمثيل الضوئي</h1>
  <div class="houses" id="houses" title="بيوت قريتك"><span>🏠</span><span>🏠</span><span>🏠</span><span>🏰</span></div>
  <button class="iconbtn" id="mapBtn" aria-label="خريطة القرية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
  <button class="iconbtn" id="themeBtn" aria-label="الوضع الليلي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></header>

<main class="wrap" id="app"></main>
<div class="wrap foot"><a href="../">فهرس دروس الفصل</a> · القرية التعليمية · سلطنة عُمان</div>

<script>
/* ======================= أدوات ======================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const KEY = 'qv_l11_v2';
let S = { pre: null, post: null, done: [false, false, false], fin: false, rate: {} };
try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v) S = Object.assign(S, v); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2300); }
function fb(el, kind, html) { el.className = 'feedback show ' + kind; el.innerHTML = html; }
const salem = (mood, text) => `<div class="guide"><img src="assets/salem-${mood}.svg" alt="سالم"><div class="bubble"><b class="name">سالم</b><p>${text}</p></div></div>`;
(function () { try { const t = localStorage.getItem('qv_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {} })();
$('#themeBtn').onclick = () => { const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = d; try { localStorage.setItem('qv_theme', d); } catch (e) {} };
$('#mapBtn').onclick = () => go('map');
function updHouses() { $$('#houses span').forEach((h, i) => h.classList.toggle('on', i < 3 ? S.done[i] : S.fin)); }

/* ======================= المحتوى ======================= */
const GOALS = [
  'أشرح بكلماتي معنى التمثيل الضوئي.',
  'أذكر ما يحتاجه النبات ليصنع غذاءه، ومن أين يحصل على كل منها.',
  'أذكر ما يصنعه النبات في التمثيل الضوئي.'
];
// السؤال: [نص، الإجابة الصحيحة، [خيارات خاطئة]، تفسير، تصنيف اختياري]
const PRE = [
  ['كيف يحصل النبات على غذائه؟', 'يصنعه بنفسه مستخدمًا طاقة الضوء', ['يأخذه جاهزًا من التربة', 'يأخذه من ماء المطر', 'النبات لا يحتاج إلى غذاء']],
  ['ماذا يحتاج النبات ليصنع غذاءه؟', 'ضوءًا وماءً وثاني أكسيد الكربون', ['ضوءًا فقط', 'سمادًا فقط', 'أكسجينًا وسكرًا']],
  ['أي غاز يُطلقه النبات أثناء صنع غذائه؟', 'الأكسجين', ['ثاني أكسيد الكربون', 'النيتروجين', 'الهيليوم']]
];
const STATIONS = [
  { t: 'ما هو التمثيل الضوئي؟', ic: '☀️', s: 'من أين تأتي الطاقة؟ ومعنى الاسم',
    A: [
      ['ما معنى التمثيل الضوئي؟', 'عملية يصنع فيها النبات غذاءه بطاقة الضوء', ['عملية يأكل فيها الحيوان النبات', 'عملية تمتص فيها الجذور الماء', 'عملية يتحرك فيها النبات نحو الضوء'], 'التمثيل الضوئي = النبات يصنع غذاءه بنفسه، وطاقته من الضوء.'],
      ['في السلسلة: عشب ← جرادة ← سحلية ← صقر، من يقوم بالتمثيل الضوئي؟', 'العشب', ['الجرادة', 'السحلية', 'الصقر'], 'العشب هو النبات الوحيد، والنبات هو الذي يصنع غذاءه من الضوء.'],
      ['قال خالد: «كلمة Photosynthesis تعني: الأكل بالضوء». ما التصحيح؟', 'تعني: التصنيع (الإنتاج) بالضوء', ['تعني: النمو في الظلام', 'تعني: امتصاص الماء', 'كلام خالد صحيح'], 'Photo = ضوء، وSynthesis = إنتاج أو تصنيع.', 'صحّح خطأ زميلك']
    ],

/* بطاقة سؤال اختيار من متعدد. onAnswer(صحيح؟) */
function mcq(host, q, i, opts = {}) {
  const [text, right, wrong, why, label] = q;
  const choices = shuffle([right, ...wrong]);
  const div = document.createElement('div'); div.className = 'q';
  div.innerHTML = `<div class="qt">${label ? `<small>${label}</small>` : ''}${ar(i + 1)}) ${text}</div><div class="opts">${choices.map(c => `<button class="opt">${c}</button>`).join('')}</div><div class="why" hidden></div>`;
  host.appendChild(div);
  $$('.opt', div).forEach(b => b.onclick = () => {
    if (div.dataset.done) return; div.dataset.done = 1;
    const ok = b.textContent === right;
    if (opts.silent) { b.classList.add('sel'); }
    else {
      b.classList.add(ok ? 'right' : 'wrong');
      if (!ok) $$('.opt', div).find(x => x.textContent === right).classList.add('right');
      if (why && typeof why === 'string' && !why.startsWith('الهدف')) { const w = $('.why', div); w.hidden = false; w.innerHTML = (ok ? '✅ ' : '💡 ') + why; }
    }
    $$('.opt', div).forEach(x => x.disabled = true);
    opts.onAnswer && opts.onAnswer(ok);
  });
}

(function () {
  const h = (location.hash || '').slice(1);
  const m = h.match(/^st-(\d)$/);
  if (m && (+m[1] === 0 || S.done[+m[1] - 1])) go('st', +m[1]);
  else if (['map', 'pre'].includes(h) && S.pre !== null) go(h);
  else if (h === 'final' && S.done.every(Boolean)) go('final');
  else if (h === 'end' && S.fin) go('end');
  else go('start');
})();
</script>
